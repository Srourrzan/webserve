# Full test for inheritance
   
    
    server {
         root /http/root;
    index http_index.html;
    client_max_body_size 2048;
    autoindex on;
    cgi_bin_path /usr/lib/cgi-bin;
    error_page 404 /http/404.html;
        listen localhost:80;
        server_name server1.com;
        root /server1/root;
        
        location /api {
            cgi on;
            cgi_ext .pl;
            methods GET POST;
            root /api/root;
        }
        
        location /inherit {
            methods POST;
        }
    }
    
    server {
        listen 9090;
        server_name server2.com;
        autoindex off;
        
        location /test {
            methods DELETE ;
            index location_index.html;
        }
    }
    
    server {
        listen 7070;
    }

