# Comprehensive config to exercise all supported parser features.
# Max upload body size in this file is set with `client_max_body_size`.

http {
    # Global defaults inherited by all servers/locations unless overridden.
    root ./www;
    index /html/index.html;
    client_max_body_size 2M;      # 2 MiB = 2097152 bytes
    autoindex off;
    cgi_bin_path ./www/cgi_bin;

    error_page 400 405 /html/error_pages/400.html;
    error_page 404 /html/error_pages/404.html;
    error_page 505 /html/error_pages/50x.html;

    server {
        listen 127.0.0.1:8081;
        server_name localhost;


        # Upload tests (POST/DELETE/GET) -> /upload/* under ./www
        location / {
            methods GET POST DELETE;
            upload on;
            upload_path /upload;
        }

        # CGI test path: /cgi-bin/*.py or /cgi-bin/*.cgi
        location /cgi_bin {
            cgi on;
            cgi_ext .py .cgi;
            methods GET POST;
            #cgi_bin_path ./www/cgi_bin;
        }

        # Autoindex ON test path
        location /browse {
            index /missing-index.html;
            autoindex on;
            methods GET;
        }

        # Autoindex OFF test path
        location /noindex {
            index /missing-index.html;
            autoindex off;
            methods GET;
        }

        # Redirect tests
        location /old-page {
            return 301 /html/new-page.html;
        }

        location /temp {
            return 302 /html/temp-location.html;
        }

        location /choices {
            return 300 /html/index.html;
        }
    }

    server {
        listen 127.0.0.1:8080;
        server_name example.com ;
        root ./www;
        index /html/index.html;
        client_max_body_size 1M;
        autoindex on;

        location / {
            methods GET;
            upload off;
        }

        location /test-autoindex {
            root ./www/test_autoindex;
            index /missing-index.html;
            autoindex on;
            methods GET;
        }

        location /-upload {
            methods POST;
            upload off;
            upload_path /upload;
        }
    }

    server {
        listen 127.0.0.1:8082;
        server_name cgi.local *.webserv.local;
        root ./www;
        client_max_body_size 512K;
        autoindex off;

        location / {
            methods GET POST;
            upload on;
            upload_path /upload;
        }

        # Alternate CGI test path
        location /scripts {
            root ./www/cgi_bin;
            methods GET POST;
            cgi on;
            cgi_ext .py .cgi;
            cgi_bin_path ./www/cgi_bin;
        }

        location /blocked-listing {
            root ./www/test_autoindex;
            index /missing-index.html;
            autoindex off;
            methods GET;
        }
    }
}
